# ============================================================
# ci.yml — GitHub Actions CI/CD Pipeline
# MSP Support Bot — UDRSE / NSF-DARSE
#
# Triggers on every push or pull request to MSP-support-bot
# No secrets needed — integration tests call live Azure API
# ============================================================

name: MSP Support Bot — CI Pipeline

on:
  push:
    branches:
      - MSP-support-bot
  pull_request:
    branches:
      - MSP-support-bot

jobs:

  # ──────────────────────────────────────────────────────────
  # JOB 1: Unit Tests
  # Tests pure Python functions — no network, no credentials
  # TestNormalizeQuery (10) + TestNotITResponse (6) + EdgeCases (4)
  # ──────────────────────────────────────────────────────────
  unit-tests:
    name: "Unit Tests (20 tests)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest fastapi uvicorn pydantic

      - name: Run unit tests
        # These functions only need placeholder env vars to import main.py
        run: |
          python -m pytest test_bot.py::TestNormalizeQuery \
                           test_bot.py::TestNotITResponse \
                           test_bot.py::TestNormalizeQueryEdgeCases \
                           -v --tb=short
        env:
          PG_HOST: placeholder
          PG_DATABASE: placeholder
          PG_USER: placeholder
          PG_PASSWORD: placeholder
          PG_PORT: "5432"
          OPENAI_API_KEY: placeholder
          OPENAI_MODEL: gpt-4o
          AZURE_BOT_APP_ID: placeholder
          AZURE_BOT_APP_SECRET: placeholder
          AZURE_TENANT_ID: placeholder

  # ──────────────────────────────────────────────────────────
  # JOB 2: Integration Tests
  # Calls the live Azure Function App API — no secrets needed
  # The Azure Function App already holds all credentials
  # TestAPIEndpoints (8) + TestEndToEnd (2)
  # ──────────────────────────────────────────────────────────
  integration-tests:
    name: "Integration Tests — Live Azure API (10 tests)"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest fastapi uvicorn pydantic

      - name: Run integration and end-to-end tests
        # Tests call the live Azure URL hardcoded in test_bot.py
        # No credentials needed here — Azure Function holds them
        run: |
          python -m pytest test_bot.py::TestAPIEndpoints \
                           test_bot.py::TestEndToEnd \
                           -v --tb=short
        env:
          PG_HOST: placeholder
          PG_DATABASE: placeholder
          PG_USER: placeholder
          PG_PASSWORD: placeholder
          PG_PORT: "5432"
          OPENAI_API_KEY: placeholder
          OPENAI_MODEL: gpt-4o
          AZURE_BOT_APP_ID: placeholder
          AZURE_BOT_APP_SECRET: placeholder
          AZURE_TENANT_ID: placeholder

  # ──────────────────────────────────────────────────────────
  # JOB 3: Full Suite + Summary Report
  # Runs all 30 tests and uploads results as artifact
  # Only on push (not pull requests)
  # ──────────────────────────────────────────────────────────
  full-suite:
    name: "Full Suite — All 30 Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-json-report fastapi uvicorn pydantic

      - name: Run all 30 tests with report
        run: |
          python -m pytest test_bot.py -v \
            --tb=short \
            --json-report \
            --json-report-file=test-results.json
        env:
          PG_HOST: placeholder
          PG_DATABASE: placeholder
          PG_USER: placeholder
          PG_PASSWORD: placeholder
          PG_PORT: "5432"
          OPENAI_API_KEY: placeholder
          OPENAI_MODEL: gpt-4o
          AZURE_BOT_APP_ID: placeholder
          AZURE_BOT_APP_SECRET: placeholder
          AZURE_TENANT_ID: placeholder

      - name: Print test summary
        if: always()
        run: |
          python -c "
          import json
          with open('test-results.json') as f:
              r = json.load(f)
          s = r['summary']
          print(f\"\")
          print(f\"{'='*50}\")
          print(f\"  MSP Support Bot — CI Test Results\")
          print(f\"{'='*50}\")
          print(f\"  Total   : {s.get('total', 0)}\")
          print(f\"  Passed  : {s.get('passed', 0)}\")
          print(f\"  Failed  : {s.get('failed', 0)}\")
          print(f\"  Duration: {r.get('duration', 0):.1f}s\")
          print(f\"{'='*50}\")
          "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.json
          retention-days: 30